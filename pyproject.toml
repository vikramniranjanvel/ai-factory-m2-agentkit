[project]
name = "agentkit"
version = "0.1.0"
description = "AgentKit CLI for the AI Factory (Maturity 2)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "pyyaml>=6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
