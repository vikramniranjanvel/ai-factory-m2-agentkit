[project]
name = "agentkit"
version = "0.1.0"
description = "AgentKit CLI for the AI Factory (Maturity 2)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
